<script>
const URL_ = "https://script.google.com/macros/s/AKfycbzp1N5ehl-zl_Ka-mOU9bUQNX8l-1l2YKmDoa4AMkyu9rhVdVi4VgZfKjyA1aFA2g6V5w/exec";

const HIST = JSON.parse(localStorage.getItem("pam_hist") || "[]");

document.getElementById("hfecha").textContent =
  new Date().toLocaleDateString("es-AR", {
    weekday: "long",
    day: "numeric",
    month: "long"
  });

function toast(msg, type = "ok") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + type;

  setTimeout(() => {
    t.classList.add("hidden");
  }, 3000);
}

function tab(name, btn) {
  document.querySelectorAll(".sec").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".nb").forEach(b => b.classList.remove("active"));

  document.getElementById("tab-" + name).classList.add("active");
  btn.classList.add("active");

  if (name === "historial") renderHist();
}

function jsonp(url) {
  return new Promise((resolve, reject) => {

    const cbName =
      "jsonp_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    const script = document.createElement("script");

    let finished = false;

    function cleanup() {
      finished = true;

      try {
        delete window[cbName];
      } catch(e){}

      try {
        script.remove();
      } catch(e){}
    }

    window[cbName] = function(data) {
      if (finished) return;
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      if (finished) return;
      cleanup();
      reject(new Error("Error de conexión"));
    };

    script.src =
      url +
      (url.includes("?") ? "&" : "?") +
      "callback=" +
      cbName +
      "&_=" +
      Date.now();

    document.body.appendChild(script);

    setTimeout(() => {
      if (finished) return;
      cleanup();
      reject(new Error("Timeout"));
    }, 10000);

  });
}

async function cargarListas() {

  try {

    const d = await jsonp(URL_ + "?action=getListas");

    console.log("LISTAS:", d);

    if (!d || !d.ok) {
      toast("No se pudieron cargar las listas", "err");
      return;
    }

    fill("ue", d.equipos);
    fill("uo", d.operarios);
    fill("uw", d.obras);

    fill("ge", d.equipos);
    fill("go", d.operarios);
    fill("gw", d.obras);

  } catch(err) {

    console.error(err);

    toast("Error de conexión", "err");
  }
}

function fill(id, list) {

  const s = document.getElementById(id);

  s.innerHTML = "";

  if (!list || !list.length) {

    const o = document.createElement("option");
    o.value = "";
    o.textContent = "— Sin datos —";

    s.appendChild(o);

    return;
  }

  const first = document.createElement("option");
  first.value = "";
  first.textContent = "— Seleccionar —";

  s.appendChild(first);

  list.forEach(v => {

    const o = document.createElement("option");

    o.value = v;
    o.textContent = v;

    s.appendChild(o);

  });
}

function g(id) {
  return document.getElementById(id).value.trim();
}

function marcarError(id) {

  const el = document.getElementById(id);

  el.classList.add("error");

  const clear = () => el.classList.remove("error");

  el.addEventListener("change", clear, { once:true });
  el.addEventListener("input", clear, { once:true });
}

async function call(params, tipo, btn, txt) {

  const query = new URLSearchParams(params).toString();

  try {

    const d = await jsonp(URL_ + "?" + query);

    console.log("RESP:", d);

    if (!d || !d.ok) {

      toast(
        d?.mensaje || "Error al guardar",
        "err"
      );

      return;
    }

    toast("Guardado correctamente");

    guardarHist(tipo, params);

  } catch(err) {

    console.error(err);

    toast("Error de conexión", "err");

  } finally {

    btn.disabled = false;
    btn.innerHTML = txt;
  }
}

function envUso() {

  let ok = true;

  if (!g("ue")) {
    marcarError("ue");
    ok = false;
  }

  if (!g("uo")) {
    marcarError("uo");
    ok = false;
  }

  if (!g("uhk")) {
    marcarError("uhk");
    ok = false;
  }

  if (!ok) {
    toast("Completá los campos obligatorios", "err");
    return;
  }

  const b = document.getElementById("buso");

  b.disabled = true;
  b.innerHTML = '<span class="spin"></span>Guardando...';

  const p = {
    action: "registrarUso",
    equipo: g("ue"),
    operario: g("uo"),
    obra: g("uw"),
    horasKm: g("uhk"),
    trabajo: g("ut"),
    arreglos: g("ua"),
    observaciones: g("uob")
  };

  call(p, "uso", b, "Guardar registro");
}

function envGas() {

  let ok = true;

  if (!g("ge")) {
    marcarError("ge");
    ok = false;
  }

  if (!g("go")) {
    marcarError("go");
    ok = false;
  }

  if (!g("gl")) {
    marcarError("gl");
    ok = false;
  }

  if (!g("ghk")) {
    marcarError("ghk");
    ok = false;
  }

  if (!ok) {
    toast("Completá los campos obligatorios", "err");
    return;
  }

  const b = document.getElementById("bgas");

  b.disabled = true;
  b.innerHTML = '<span class="spin"></span>Guardando...';

  const p = {
    action: "registrarGasoil",
    equipo: g("ge"),
    operario: g("go"),
    obra: g("gw"),
    litros: g("gl"),
    horasKm: g("ghk"),
    observaciones: g("gob")
  };

  call(p, "gasoil", b, "Guardar carga");
}

function guardarHist(tipo, data) {

  HIST.unshift({
    tipo,
    data,
    fecha: new Date().toLocaleString("es-AR")
  });

  HIST.splice(20);

  localStorage.setItem(
    "pam_hist",
    JSON.stringify(HIST)
  );

  renderHist();
}

function renderHist() {

  const c = document.getElementById("hlist");

  if (!HIST.length) {

    c.innerHTML =
      '<div class="empty">Sin registros recientes</div>';

    return;
  }

  c.innerHTML = HIST.map(h => {

    return `
      <div class="hi">
        <div class="hi-top">
          <div class="hi-eq">
            ${h.data.equipo || "-"}
            <span class="badge ${h.tipo === "uso" ? "bu" : "bg"}">
              ${h.tipo}
            </span>
          </div>
          <div class="hi-t">${h.fecha}</div>
        </div>

        <div class="hi-d">
          ${h.data.operario || "-"}
        </div>
      </div>
    `;

  }).join("");
}

cargarListas();
</script>
