<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Planillas Amarillas</title>
<style>
:root{--am:#F5C800;--bg:#f5f5f0;--card:#fff;--text:#1a1a1a;--text2:#555;--bor:#e0e0d8;--radius:12px;--rsm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.header{background:var(--am);padding:16px 20px;display:flex;align-items:center;gap:12px;}
.header h1{font-size:18px;font-weight:700;}
.header p{font-size:12px;color:rgba(0,0,0,0.5);}
.cfg{background:#fff3cd;border-bottom:1px solid #ffe08a;padding:12px 16px;font-size:14px;color:#7a5a00;}
.cfg.hidden{display:none;}
.cfg strong{display:block;margin-bottom:6px;}
.cfg input{width:100%;margin-top:4px;padding:10px;border:1px solid #ffe08a;border-radius:6px;font-size:14px;background:#fffdf0;color:#1a1a1a;}
.cfg button{margin-top:8px;background:var(--am);border:none;border-radius:6px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;width:100%;}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff;border-bottom:1px solid var(--bor);}
.nb{padding:12px 4px;font-size:13px;border:none;background:none;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;}
.nb.active{color:#1a1a1a;border-bottom-color:var(--am);font-weight:700;}
.sec{display:none;padding:16px;max-width:480px;margin:0 auto;}
.sec.active{display:block;}
.card{background:#fff;border-radius:var(--radius);border:0.5px solid var(--bor);padding:16px;margin-bottom:12px;}
.ct{font-size:15px;font-weight:600;margin-bottom:14px;}
.f{margin-bottom:13px;}
.f label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
.f select,.f input,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--bor);border-radius:var(--rsm);font-size:16px;background:#fafaf8;color:var(--text);-webkit-appearance:none;appearance:none;}
.f textarea{resize:none;height:70px;font-family:inherit;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.tb{padding:10px;border:1.5px solid var(--bor);border-radius:var(--rsm);background:var(--bg);font-size:14px;font-weight:500;cursor:pointer;text-align:center;}
.tb.active{background:var(--am);border-color:#d4ac00;font-weight:700;}
.btn{width:100%;padding:14px;background:var(--am);border:none;border-radius:var(--rsm);font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--rsm);font-size:14px;font-weight:500;z-index:999;max-width:90vw;text-align:center;pointer-events:none;}
.toast.ok{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5;}
.toast.err{background:#FCEBEB;color:#A32D2D;border:1px solid #F09595;}
.toast.hidden{display:none;}
.hi{background:#fff;border-radius:var(--rsm);border:.5px solid var(--bor);padding:12px 14px;margin-bottom:8px;}
.hi-top{display:flex;justify-content:space-between;align-items:baseline;}
.hi-eq{font-weight:600;font-size:14px;}
.hi-t{font-size:12px;color:var(--text2);}
.hi-d{font-size:13px;color:var(--text2);margin-top:4px;}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:6px;}
.bu{background:#E6F1FB;color:#0C447C;}
.bg{background:#E1F5EE;color:#085041;}
.empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:14px;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#1a1a1a;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🚜 Planillas Amarillas</h1>
    <p id="hfecha"></p>
  </div>
</div>

<div class="cfg" id="cfg">
  <strong>⚙️ Configuración — solo la primera vez</strong>
  Pegá la URL de tu Apps Script:
  <input type="url" id="iurl" placeholder="https://script.google.com/macros/s/.../exec">
  <button onclick="guardarUrl()">Guardar y conectar</button>
</div>

<div class="nav">
  <button class="nb active" onclick="tab('uso',this)">📋 Uso diario</button>
  <button class="nb" onclick="tab('gasoil',this)">⛽ Gasoil</button>
  <button class="nb" onclick="tab('historial',this)">🕐 Historial</button>
</div>

<div class="sec active" id="tab-uso">
  <div class="card">
    <div class="ct">🔧 Registro de uso</div>
    <div class="f"><label>Equipo</label><select id="ue"><option value="">— Equipo —</option></select></div>
    <div class="f"><label>Operario</label><select id="uo"><option value="">— Operario —</option></select></div>
    <div class="f"><label>Obra / Lugar</label><select id="uw"><option value="">— Obra —</option></select></div>
    <div class="tt">
      <button class="tb active" id="bh" onclick="tipo('horas')">⏱ Horas</button>
      <button class="tb" id="bk" onclick="tipo('km')">🛣 Km</button>
    </div>
    <div class="f"><label id="lhk">Horas actuales del equipo</label><input type="number" id="uhk" placeholder="Ej: 2540" inputmode="numeric"></div>
    <div class="f"><label>Tipo de trabajo</label>
      <select id="ut">
        <option value="">— Seleccionar —</option>
        <option>Nivelación</option>
        <option>Logística y Traslado de Personal</option>
        <option>Mantenimiento</option>
        <option>Excavación</option>
        <option>Compactación</option>
        <option>Otro</option>
      </select>
    </div>
    <div class="f"><label>Arreglos / Fallas</label><input type="text" id="ua" placeholder="Opcional"></div>
    <div class="f"><label>Observaciones</label><textarea id="uob" placeholder="Opcional"></textarea></div>
    <button class="btn" id="buso" onclick="envUso()">Guardar registro</button>
  </div>
</div>

<div class="sec" id="tab-gasoil">
  <div class="card">
    <div class="ct">⛽ Carga de gasoil / nafta</div>
    <div class="f"><label>Equipo</label><select id="ge"><option value="">— Equipo —</option></select></div>
    <div class="f"><label>Operario</label><select id="go"><option value="">— Operario —</option></select></div>
    <div class="f"><label>Obra / Lugar</label><select id="gw"><option value="">— Obra —</option></select></div>
    <div class="fr">
      <div class="f"><label>Litros</label><input type="number" id="gl" placeholder="Ej: 120" inputmode="decimal"></div>
      <div class="f"><label>Horas / Km</label><input type="number" id="ghk" placeholder="Ej: 2540" inputmode="numeric"></div>
    </div>
    <div class="f"><label>Observaciones</label><textarea id="gob" placeholder="Opcional"></textarea></div>
    <button class="btn" id="bgas" onclick="envGas()">Guardar carga</button>
  </div>
</div>

<div class="sec" id="tab-historial">
  <div id="hlist"></div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
var URL_ = localStorage.getItem("pam_url")||"";
var TM = "horas";
var HIST = JSON.parse(localStorage.getItem("pam_hist")||"[]");

document.getElementById("hfecha").textContent =
  new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});

if(URL_){ document.getElementById("cfg").classList.add("hidden"); cargarListas(); }

function guardarUrl(){
  var v=document.getElementById("iurl").value.trim();
  if(!v||v.indexOf("script.google.com")===-1){toast("URL inválida","err");return;}
  URL_=v; localStorage.setItem("pam_url",URL_);
  document.getElementById("cfg").classList.add("hidden");
  cargarListas();
}

function jsonp(url,cb){
  var n="cb_"+Math.random().toString(36).slice(2);
  window[n]=function(d){delete window[n];document.head.removeChild(s);cb(null,d);};
  var s=document.createElement("script");
  s.onerror=function(){delete window[n];document.head.removeChild(s);cb(new Error("err"));};
  s.src=url+(url.indexOf("?")>=0?"&":"?")+"callback="+n;
  document.head.appendChild(s);
}

function cargarListas(){
  if(!URL_)return;
  jsonp(URL_+"?action=getListas",function(err,d){
    if(err||!d||!d.ok){toast("No se pudo cargar listas","err");return;}
    fill("ue",d.equipos,"— Equipo —"); fill("uo",d.operarios,"— Operario —"); fill("uw",d.obras,"— Obra —");
    fill("ge",d.equipos,"— Equipo —"); fill("go",d.operarios,"— Operario —"); fill("gw",d.obras,"— Obra —");
  });
}

function fill(id,list,ph){
  var s=document.getElementById(id);
  s.innerHTML="<option value=''>"+ph+"</option>"+list.map(function(v){return"<option>"+v+"</option>";}).join("");
}

function tipo(t){
  TM=t;
  document.getElementById("bh").classList.toggle("active",t==="horas");
  document.getElementById("bk").classList.toggle("active",t==="km");
  document.getElementById("lhk").textContent=t==="horas"?"Horas actuales del equipo":"Kilómetros actuales";
}

function g(id){return document.getElementById(id).value;}

function envUso(){
  if(!g("ue")||!g("uo")||!g("uw")||!g("uhk")){toast("Completá equipo, operario, obra y horas/km","err");return;}
  var b=document.getElementById("buso");
  b.disabled=true; b.innerHTML='<span class="spin"></span>Guardando...';
  var p={action:"registrarUso",equipo:g("ue"),operario:g("uo"),obra:g("uw"),
    horasKm:g("uhk"),tipoMedicion:TM,trabajo:g("ut"),arreglos:g("ua"),observaciones:g("uob")};
  call(p,"uso",b,"Guardar registro");
}

function envGas(){
  if(!g("ge")||!g("go")||!g("gl")||!g("ghk")){toast("Completá equipo, operario, litros y horas/km","err");return;}
  var b=document.getElementById("bgas");
  b.disabled=true; b.innerHTML='<span class="spin"></span>Guardando...';
  var p={action:"registrarGasoil",equipo:g("ge"),operario:g("go"),obra:g("gw"),
    litros:g("gl"),horasKm:g("ghk"),observaciones:g("gob")};
  call(p,"gasoil",b,"Guardar carga");
}

function call(p,tipo,btn,label){
  if(!URL_){toast("Configurá la URL primero","err");btn.disabled=false;btn.textContent=label;return;}
  var qs=Object.keys(p).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(p[k]);}).join("&");
  jsonp(URL_+"?"+qs,function(err,d){
    btn.disabled=false; btn.textContent=label;
    if(err||!d){toast("Sin conexión. Reintentá.","err");return;}
    if(d.ok){
      HIST.unshift(Object.assign({},p,{tipo:tipo,ts:new Date().toISOString()}));
      if(HIST.length>50)HIST=HIST.slice(0,50);
      localStorage.setItem("pam_hist",JSON.stringify(HIST));
      limpiar(tipo); toast("✓ Guardado en el Sheet","ok");
    } else { toast("Error: "+(d.mensaje||"?"),"err"); }
  });
}

function limpiar(t){
  if(t==="uso"){["ue","uo","uw","ut"].forEach(function(i){document.getElementById(i).value="";});
    ["uhk","ua","uob"].forEach(function(i){document.getElementById(i).value="";});}
  else{["ge","go","gw"].forEach(function(i){document.getElementById(i).value="";});
    ["gl","ghk","gob"].forEach(function(i){document.getElementById(i).value="";});}
}

function tab(n,el){
  document.querySelectorAll(".sec").forEach(function(s){s.classList.remove("active");});
  document.querySelectorAll(".nb").forEach(function(b){b.classList.remove("active");});
  document.getElementById("tab-"+n).classList.add("active");
  if(el)el.classList.add("active");
  if(n==="historial")renderHist();
}

function renderHist(){
  var el=document.getElementById("hlist");
  if(!HIST.length){el.innerHTML='<div class="empty">Sin registros en este dispositivo.</div>';return;}
  el.innerHTML=HIST.map(function(h){
    var f=new Date(h.ts).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    var badge=h.tipo==="gasoil"?'<span class="badge bg">Gasoil</span>':'<span class="badge bu">Uso</span>';
    var det=h.tipo==="gasoil"?h.operario+" · "+h.litros+"L · "+h.horasKm+" hs/km"
      :h.operario+" · "+h.horasKm+" "+(h.tipoMedicion==="km"?"km":"hs")+" · "+(h.trabajo||"—");
    return'<div class="hi"><div class="hi-top"><span class="hi-eq">'+h.equipo+badge+'</span><span class="hi-t">'+f+'</span></div><div class="hi-d">'+det+'</div></div>';
  }).join("");
}

function toast(msg,type){
  var t=document.getElementById("toast");
  t.textContent=msg; t.className="toast "+type;
  clearTimeout(window._tt);
  window._tt=setTimeout(function(){t.className="toast hidden";},3500);
}
</script>
</body>
</html>
