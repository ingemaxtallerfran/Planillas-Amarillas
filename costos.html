<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Ingemax — Costos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--naranja:#E8651A;--negro:#0f0f0f;--gris1:#1a1a1a;--gris2:#252525;--gris3:#333;--gris5:#888;--borde:#2e2e2e;--texto:#f0f0f0;--texto2:#aaa;--verde:#22c55e;--radius:10px;--rsm:7px}
    [data-theme="light"]{--naranja:#D9540A;--negro:#f2f2f2;--gris1:#fff;--gris2:#eaeaea;--gris3:#d5d5d5;--gris5:#6b6b6b;--borde:#d0d0d0;--texto:#111;--texto2:#444;--verde:#16a34a}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'Barlow',sans-serif;background:var(--negro);color:var(--texto);min-height:100vh;transition:background .2s,color .2s}
    .header{background:var(--gris1);border-bottom:2px solid var(--naranja);padding:0 12px;display:flex;align-items:center;gap:10px;height:56px;position:sticky;top:0;z-index:100}
    [data-theme="light"] .header{box-shadow:0 1px 4px rgba(0,0,0,.08)}
    .back-btn{background:var(--gris2);border:1px solid var(--borde);border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--texto);text-decoration:none;flex-shrink:0}
    .logo-box{background:#fff;border-radius:7px;padding:5px 10px;display:flex;align-items:center;height:40px}
    .logo-img{height:28px;width:auto;display:block}
    .logo-fallback{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:#111}
    .logo-fallback span{color:var(--naranja)}
    .title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:1}
    .theme-btn{background:var(--gris2);border:1px solid var(--borde);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .wrap{max-width:580px;margin:0 auto;padding:16px}
    .card{background:var(--gris1);border:1px solid var(--borde);border-radius:var(--radius);padding:18px;margin-bottom:14px}
    [data-theme="light"] .card{box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .card-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--texto2);margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .card-title::before{content:'';width:4px;height:15px;background:var(--naranja);border-radius:2px;flex-shrink:0}
    .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--texto2);margin-bottom:4px}
    .stat-val{font-family:'Barlow Condensed',sans-serif;font-weight:800}
    .stat-val.naranja{color:var(--naranja)}.stat-val.verde{color:var(--verde)}
    .list-item{background:var(--gris1);border:1px solid var(--borde);border-radius:var(--radius);padding:13px 15px;margin-bottom:8px}
    [data-theme="light"] .list-item{box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .item-top{display:flex;justify-content:space-between;align-items:flex-start}
    .item-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;line-height:1.2}
    .item-date{white-space:nowrap;margin-left:8px;flex-shrink:0}
    .item-body{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
    .tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}
    .tag-gray{background:rgba(255,255,255,.07);color:var(--texto2);border:1px solid var(--borde)}
    [data-theme="light"] .tag-gray{background:rgba(0,0,0,.05)}
    .back-link{display:flex;align-items:center;gap:8px;padding:8px 0 12px;cursor:pointer;color:var(--naranja);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:none;background:none}
    .empty{text-align:center;padding:50px 20px;color:var(--gris5);font-size:14px}
    .loading{text-align:center;padding:40px;color:var(--gris5)}
    .spin{display:inline-block;width:28px;height:28px;border:3px solid var(--gris3);border-top-color:var(--naranja);border-radius:50%;animation:sp .7s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    @media (min-width:900px){.wrap{max-width:1100px}#eqCardsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}}
  </style>
</head>
<body>
  <div class="header">
    <a class="back-btn" href="menu" title="Volver al menú">‹</a>
    <div class="logo-box">
      <img src="logo-ingemax.jpg" alt="INGEMAX" class="logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div class="logo-fallback" style="display:none">INGEMA<span>X</span></div>
    </div>
    <div class="title">Costos</div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTema()">🌙</button>
  </div>

  <div class="wrap">
    <div id="costosResumen"><div class="loading"><div class="spin"></div></div></div>
    <div id="costosDetalle" style="display:none">
      <button class="back-link" onclick="costosVolver()">‹ Volver</button>
      <div id="costosDetalleBody"></div>
    </div>
  </div>

<script>
const URL_ = "https://script.google.com/macros/s/AKfycbwh9fSHZ0Tt6nGQFcWFJg7P5L4jUVoRdhs1QhulVECMqmn7ACv58VUUprOhMQviszKSew/exec";
const S = {};

// ── TEMA ──
function aplicarTema(t){
  const b=document.getElementById("themeBtn");
  if(t==="light"){document.documentElement.setAttribute("data-theme","light");if(b)b.textContent="☀️";}
  else{document.documentElement.removeAttribute("data-theme");if(b)b.textContent="🌙";}
  try{sessionStorage.setItem("tema",t);}catch(e){}
}
function toggleTema(){
  const a=document.documentElement.getAttribute("data-theme")==="light"?"light":"dark";
  aplicarTema(a==="light"?"dark":"light");
}
(function(){let t="dark";try{t=sessionStorage.getItem("tema")||"dark";}catch(e){}if(t==="light")document.documentElement.setAttribute("data-theme","light");})();

// ── JSONP ──
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*1e5);
    const s=document.createElement("script");let done=false;
    const clean=()=>{done=true;try{delete window[cb]}catch(e){}try{s.remove()}catch(e){}};
    window[cb]=d=>{if(done)return;clean();res(d);};
    s.onerror=()=>{if(done)return;clean();rej(new Error("error"));};
    s.src=url+(url.includes("?")?"&":"?")+"callback="+cb+"&_="+Date.now();
    document.body.appendChild(s);
    setTimeout(()=>{if(done)return;clean();rej(new Error("timeout"));},20000);
  });
}

// ── GRUPOS (igual que la app de equipos) ──
function normalizarCodigo(c){if(!c)return"";return String(c).trim().split(/[\s\/,]/)[0].trim().toUpperCase();}
function getGrupoDeEquipo(codigo){
  if(!codigo)return null;
  const c=codigo.trim().toUpperCase();
  const adit=["FR18","MH18","BR","BA","BH1","RV1","ES1","H1","Z1","BH","RV","ES"];
  for(const p of adit){if(c.startsWith(p))return"Aditamentos";}
  const multi=[{p:"CH",n:"Chulengos"},{p:"HV",n:"Compactadores"},{p:"CR",n:"Carros/Casillas"},{p:"AS",n:"Aserradoras"}];
  for(const m of multi){if(c.startsWith(m.p))return m.n;}
  const una=[{p:"B",n:"Minicargadoras"},{p:"S",n:"Aplanadoras"},{p:"M",n:"Motoniveladoras"},{p:"T",n:"Palas/Tractores"},{p:"C",n:"Camiones"},{p:"P",n:"Camionetas"},{p:"R",n:"Retroexcavadora"},{p:"L",n:"Terminadora"},{p:"F",n:"Fusores"},{p:"N",n:"Pisones/Placas"},{p:"U",n:"Martillos"}];
  for(const u of una){if(c.startsWith(u.p))return u.n;}
  return"Otros";
}
function fmtPeso(n){n=Number(n)||0;return "$"+n.toLocaleString("es-AR",{maximumFractionDigits:0});}

// ── CARGA ──
async function costosCargar(){
  const cont=document.getElementById("costosResumen");
  try{
    const [r26,rH]=await Promise.allSettled([
      jsonp(`${URL_}?action=getCostos2026`),
      jsonp(`${URL_}?action=getCostosHistorico`)
    ]);
    S.costos2026=(r26.status==="fulfilled"&&r26.value?.ok)?r26.value:null;
    S.costosHist=(rH.status==="fulfilled"&&rH.value?.ok)?rH.value:null;
    if(!S.costos2026&&!S.costosHist){cont.innerHTML='<div class="empty">No se pudieron cargar los datos de costos.</div>';return;}
    costosRenderResumen();
  }catch(e){cont.innerHTML='<div class="empty">Error de conexión</div>';}
}

function costosPorTipo(){
  const porTipo={};
  if(!S.costos2026)return porTipo;
  S.costos2026.equipos.forEach(e=>{
    const g=getGrupoDeEquipo(e.codigo)||"Otros";
    if(!porTipo[g])porTipo[g]={total:0,count:0,prom:0};
    porTipo[g].total+=(e.total||0);porTipo[g].count++;
  });
  Object.keys(porTipo).forEach(t=>{porTipo[t].prom=porTipo[t].count>0?porTipo[t].total/porTipo[t].count:0;});
  return porTipo;
}

function costosRenderResumen(){
  const cont=document.getElementById("costosResumen");
  document.getElementById("costosDetalle").style.display="none";
  cont.style.display="block";
  const anioActual=new Date().getFullYear();
  let html="";

  if(S.costos2026){
    const total2026=S.costos2026.equipos.reduce((s,e)=>s+(e.total||0),0);
    html+=`<div class="card" style="cursor:pointer;border-left:4px solid var(--naranja)" onclick="costosVerMeses()">
      <div class="stat-label">Gastado en ${anioActual} — todos los equipos</div>
      <div class="stat-val naranja" style="font-size:32px">${fmtPeso(total2026)}</div>
      <div style="font-size:12px;color:var(--naranja);margin-top:8px;font-weight:600">Ver mes a mes ›</div>
    </div>`;
  }
  if(S.costosHist&&S.costosHist.anios.length){
    // Usar los totales oficiales de la fila 91 (no sumar equipo por equipo)
    const tpa=(S.costosHist.totales&&S.costosHist.totales.length)
      ? S.costosHist.totales.map(t=>({anio:t.anio,suma:t.monto}))
      : S.costosHist.anios.map(anio=>({anio,suma:S.costosHist.equipos.reduce((s,e)=>{const a=e.anios.find(x=>x.anio===anio);return s+(a?a.monto:0);},0)}));
    const prom=tpa.reduce((s,t)=>s+t.suma,0)/tpa.length;
    html+=`<div class="card" style="cursor:pointer;border-left:4px solid var(--verde)" onclick="costosVerAnios()">
      <div class="stat-label">Promedio anual de inversión (ajustado)</div>
      <div class="stat-val verde" style="font-size:28px">${fmtPeso(prom)}</div>
      <div style="font-size:12px;color:var(--texto2);margin-top:4px">Promedio ${S.costosHist.anios[0]}–${S.costosHist.anios[S.costosHist.anios.length-1]}</div>
      <div style="font-size:12px;color:var(--verde);margin-top:8px;font-weight:600">Ver año a año ›</div>
    </div>`;
  }
  if(S.costos2026){
    const pt=costosPorTipo();
    const tipos=Object.keys(pt).map(t=>({tipo:t,...pt[t]})).sort((a,b)=>b.total-a.total);
    html+=`<div class="card"><div class="card-title">Costo por tipo de equipo (${anioActual})</div>${tipos.map(t=>{
      const barPct=Math.round(t.total/(tipos[0].total||1)*100);
      return `<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
          <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px">${t.tipo}</span>
          <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:var(--naranja)">${fmtPeso(t.total)}</span>
        </div>
        <div style="background:var(--gris2);border-radius:4px;height:8px;overflow:hidden"><div style="background:var(--naranja);height:100%;width:${barPct}%;border-radius:4px"></div></div>
        <div style="font-size:11px;color:var(--texto2);margin-top:3px">${t.count} equipo${t.count>1?"s":""} · promedio ${fmtPeso(t.prom)} c/u</div>
      </div>`;}).join("")}</div>`;
  }
  if(S.costos2026){
    html+=`<div class="card-title" style="margin:18px 0 12px">Detalle por equipo</div><div id="eqCardsGrid">`;
    const eqs=[...S.costos2026.equipos].sort((a,b)=>(b.total||0)-(a.total||0));
    const pt=costosPorTipo();
    html+=eqs.map(e=>{
      const g=getGrupoDeEquipo(e.codigo)||"Otros";
      const promTipo=pt[g]?pt[g].prom:0;
      const hist=S.costosHist?S.costosHist.equipos.find(h=>normalizarCodigo(h.codigo)===normalizarCodigo(e.codigo)):null;
      let promAnualEq=null;
      if(hist&&hist.anios.length)promAnualEq=hist.anios.reduce((s,a)=>s+(a.monto||0),0)/hist.anios.length;
      const dif=promTipo>0?(e.total-promTipo):0;
      const col=e.total>promTipo?"#f87171":"var(--verde)";
      const txt=e.total>promTipo?"por encima":"por debajo";
      return `<div class="list-item" style="cursor:pointer" onclick="costosVerEquipo('${e.codigo.replace(/'/g,"\\'")}')">
        <div class="item-top">
          <div class="item-title">${e.codigo} <span style="font-size:11px;color:var(--gris5);font-weight:400">${g}</span></div>
          <div class="item-date" style="color:var(--naranja);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800">${fmtPeso(e.total)}</div>
        </div>
        <div class="item-body" style="margin-top:6px">
          ${promAnualEq!==null?`<span class="tag tag-gray">Prom. anual: ${fmtPeso(promAnualEq)}</span>`:""}
          ${promTipo>0?`<span class="tag tag-gray">Prom. ${g}: ${fmtPeso(promTipo)}</span>`:""}
        </div>
        ${promTipo>0?`<div style="font-size:11px;margin-top:5px;color:${col};font-weight:600">${e.total>promTipo?"▲":"▼"} ${fmtPeso(Math.abs(dif))} ${txt} del promedio de su tipo</div>`:""}
      </div>`;
    }).join("");
    html+=`</div>`;
  }
  cont.innerHTML=html||'<div class="empty">Sin datos</div>';
}

function costosVerMeses(){
  if(!S.costos2026)return;
  const cont=document.getElementById("costosResumen"),det=document.getElementById("costosDetalle"),body=document.getElementById("costosDetalleBody");
  const meses=S.costos2026.meses.map((mes,i)=>({mes,suma:S.costos2026.equipos.reduce((s,e)=>{const m=e.meses[i];return s+(m?m.monto:0);},0)}));
  const maxM=Math.max(...meses.map(m=>m.suma),1);
  body.innerHTML=`<div class="card"><div class="card-title">Gasto mes a mes ${new Date().getFullYear()}</div>${meses.map(m=>{
    const barPct=Math.round(m.suma/maxM*100);
    return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px">${m.mes}</span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:var(--naranja)">${fmtPeso(m.suma)}</span></div>
      <div style="background:var(--gris2);border-radius:4px;height:8px;overflow:hidden"><div style="background:var(--naranja);height:100%;width:${barPct}%;border-radius:4px"></div></div></div>`;
  }).join("")}</div>`;
  cont.style.display="none";det.style.display="block";
}

function costosVerAnios(){
  if(!S.costosHist)return;
  const cont=document.getElementById("costosResumen"),det=document.getElementById("costosDetalle"),body=document.getElementById("costosDetalleBody");
  const tpa=(S.costosHist.totales&&S.costosHist.totales.length)
    ? S.costosHist.totales.map(t=>({anio:t.anio,suma:t.monto}))
    : S.costosHist.anios.map(anio=>({anio,suma:S.costosHist.equipos.reduce((s,e)=>{const a=e.anios.find(x=>x.anio===anio);return s+(a?a.monto:0);},0)}));
  const maxA=Math.max(...tpa.map(a=>a.suma),1);
  body.innerHTML=`<div class="card"><div class="card-title">Inversión año a año (ajustado a hoy)</div>${tpa.map(a=>{
    const barPct=Math.round(a.suma/maxA*100);
    return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px">${a.anio}</span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:var(--verde)">${fmtPeso(a.suma)}</span></div>
      <div style="background:var(--gris2);border-radius:4px;height:8px;overflow:hidden"><div style="background:var(--verde);height:100%;width:${barPct}%;border-radius:4px"></div></div></div>`;
  }).join("")}</div>`;
  cont.style.display="none";det.style.display="block";
}

function costosVerEquipo(codigo){
  const cont=document.getElementById("costosResumen"),det=document.getElementById("costosDetalle"),body=document.getElementById("costosDetalleBody");
  const e2026=S.costos2026?S.costos2026.equipos.find(e=>e.codigo===codigo):null;
  const hist=S.costosHist?S.costosHist.equipos.find(h=>normalizarCodigo(h.codigo)===normalizarCodigo(codigo)):null;
  const g=getGrupoDeEquipo(codigo)||"Otros";
  const anioActual=new Date().getFullYear();
  let html=`<div class="card"><div class="card-title">${codigo} — ${g}</div>`;
  const barras=[];
  if(hist)hist.anios.forEach(a=>barras.push({label:a.anio,monto:a.monto||0}));
  if(e2026)barras.push({label:String(anioActual),monto:e2026.total||0});
  if(barras.length){
    const maxB=Math.max(...barras.map(b=>b.monto),1);
    html+=`<div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gris5);margin-bottom:10px">Inversión año a año</div>`;
    html+=barras.map(b=>{
      const barPct=Math.round(b.monto/maxB*100);
      const esA=b.label===String(anioActual);
      const col=esA?"var(--naranja)":"var(--verde)";
      return `<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
        <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px">${b.label}${esA?" (hasta ahora)":""}</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:${col}">${fmtPeso(b.monto)}</span></div>
        <div style="background:var(--gris2);border-radius:4px;height:7px;overflow:hidden"><div style="background:${col};height:100%;width:${barPct}%;border-radius:4px"></div></div></div>`;
    }).join("");
  }
  html+=`</div>`;
  if(e2026&&e2026.meses&&e2026.meses.length){
    const maxM=Math.max(...e2026.meses.map(m=>m.monto),1);
    html+=`<div class="card"><div class="card-title">Mes a mes ${anioActual}</div>`;
    html+=e2026.meses.map(m=>{
      const barPct=maxM>0?Math.round(m.monto/maxM*100):0;
      return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
        <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px">${m.mes}</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:var(--naranja)">${fmtPeso(m.monto)}</span></div>
        <div style="background:var(--gris2);border-radius:4px;height:7px;overflow:hidden"><div style="background:var(--naranja);height:100%;width:${barPct}%;border-radius:4px"></div></div></div>`;
    }).join("");
    html+=`</div>`;
  }
  body.innerHTML=html;
  cont.style.display="none";det.style.display="block";
}

function costosVolver(){
  document.getElementById("costosDetalle").style.display="none";
  document.getElementById("costosResumen").style.display="block";
}

aplicarTema(document.documentElement.getAttribute("data-theme")==="light"?"light":"dark");
costosCargar();
</script>
</body>
</html>
