<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ingemax — Planillas</title>
<style>
:root{
  --naranja:#E8651A;
  --naranja-dark:#c4521200;
  --gris:#2C2C2C;
  --gris2:#555;
  --bg:#f4f4f2;
  --card:#fff;
  --bor:#e0e0d8;
  --radius:12px;
  --rsm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--gris);}

.header{background:var(--gris);padding:14px 20px;display:flex;align-items:center;gap:14px;}
.logo-box{display:flex;align-items:center;gap:0;}
.logo-ing{font-size:22px;font-weight:900;color:#fff;letter-spacing:-0.5px;}
.logo-max{font-size:22px;font-weight:900;color:var(--naranja);letter-spacing:-0.5px;}
.logo-arrow{width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:16px solid var(--naranja);margin-left:3px;}
.header-sub{color:rgba(255,255,255,0.5);font-size:12px;margin-top:2px;}

.cfg{background:#fff3cd;border-bottom:1px solid #ffe08a;padding:12px 16px;font-size:14px;color:#7a5a00;}
.cfg.hidden{display:none;}
.cfg strong{display:block;margin-bottom:6px;}
.cfg input{width:100%;margin-top:4px;padding:10px;border:1px solid #ffe08a;border-radius:6px;font-size:14px;background:#fffdf0;color:#1a1a1a;}
.cfg button{margin-top:8px;background:var(--naranja);border:none;border-radius:6px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;width:100%;color:#fff;}

.nav{display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff;border-bottom:2px solid var(--bor);}
.nb{padding:12px 4px;font-size:13px;border:none;background:none;cursor:pointer;color:var(--gris2);border-bottom:3px solid transparent;margin-bottom:-2px;}
.nb.active{color:var(--naranja);border-bottom-color:var(--naranja);font-weight:700;}

.sec{display:none;padding:16px;max-width:480px;margin:0 auto;}
.sec.active{display:block;}

.card{background:#fff;border-radius:var(--radius);border:0.5px solid var(--bor);padding:16px;margin-bottom:12px;}
.ct{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--gris);display:flex;align-items:center;gap:8px;}
.ct-bar{width:4px;height:18px;background:var(--naranja);border-radius:2px;display:inline-block;}

.f{margin-bottom:13px;}
.f label{display:block;font-size:11px;font-weight:700;color:var(--gris2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
.f label .req{color:var(--naranja);}
.f select,.f input,.f textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--bor);
  border-radius:var(--rsm);font-size:16px;background:#fafaf8;
  color:var(--gris);-webkit-appearance:none;appearance:none;
}
.f select:focus,.f input:focus,.f textarea:focus{outline:none;border-color:var(--naranja);background:#fff;}
.f select.error,.f input.error{border-color:#E24B4A;background:#fff8f8;}
.f textarea{resize:none;height:70px;font-family:inherit;}

.btn{width:100%;padding:14px;background:var(--naranja);border:none;border-radius:var(--rsm);font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;color:#fff;letter-spacing:.02em;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn:active{opacity:.85;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--rsm);font-size:14px;font-weight:500;z-index:999;max-width:90vw;text-align:center;pointer-events:none;}
.toast.ok{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5;}
.toast.err{background:#FCEBEB;color:#A32D2D;border:1px solid #F09595;}
.toast.hidden{display:none;}

.hi{background:#fff;border-radius:var(--rsm);border:.5px solid var(--bor);padding:12px 14px;margin-bottom:8px;}
.hi-top{display:flex;justify-content:space-between;align-items:baseline;}
.hi-eq{font-weight:700;font-size:14px;}
.hi-t{font-size:12px;color:var(--gris2);}
.hi-d{font-size:13px;color:var(--gris2);margin-top:4px;}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:6px;}
.bu{background:#FEF0E7;color:#c45212;}
.bg{background:#E1F5EE;color:#085041;}
.empty{text-align:center;padding:40px 20px;color:var(--gris2);font-size:14px;}

.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg)}}

.hint{font-size:12px;color:var(--gris2);margin-top:-8px;margin-bottom:10px;}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo-box">
      <span class="logo-ing">INGEMA</span><span class="logo-max">X</span><div class="logo-arrow"></div>
    </div>
    <div class="header-sub" id="hfecha"></div>
  </div>
</div>

<div class="cfg hidden">
  <strong>⚙️ Configuración — solo la primera vez</strong>
  Pegá la URL de tu Apps Script:
  <input type="url" id="iurl" placeholder="https://script.google.com/macros/s/.../exec">
  <button onclick="guardarUrl()">Guardar y conectar</button>
</div>

<div class="nav">
  <button class="nb active" onclick="tab('uso',this)">📋 Uso diario</button>
  <button class="nb" onclick="tab('gasoil',this)">⛽ Gasoil</button>
  <button class="nb" onclick="tab('historial',this)">🕐 Historial</button>
</div>

<!-- USO DIARIO -->
<div class="sec active" id="tab-uso">
  <div class="card">
    <div class="ct"><span class="ct-bar"></span>Registro de uso diario</div>

    <div class="f">
      <label>Equipo <span class="req">*</span></label>
      <select id="ue"><option value="">— Seleccionar —</option></select>
    </div>
    <div class="f">
      <label>Operario <span class="req">*</span></label>
      <select id="uo"><option value="">— Seleccionar —</option></select>
    </div>
    <div class="f">
      <label>Obra / Lugar</label>
      <select id="uw"><option value="">— Seleccionar —</option></select>
    </div>
    <div class="f">
      <label>Horas o Km actuales <span class="req">*</span></label>
      <input type="number" id="uhk" placeholder="Ej: 2540" inputmode="numeric">
    </div>
    <div class="f">
      <label>Tipo de trabajo</label>
      <select id="ut">
        <option value="">— Seleccionar —</option>
        <option>Nivelación</option>
        <option>Logística y Traslado de Personal</option>
        <option>Mantenimiento</option>
        <option>Excavación</option>
        <option>Compactación</option>
        <option>Otro</option>
      </select>
    </div>
    <div class="f">
      <label>Arreglos / Fallas</label>
      <input type="text" id="ua" placeholder="Opcional">
    </div>
    <div class="f">
      <label>Observaciones</label>
      <textarea id="uob" placeholder="Opcional"></textarea>
    </div>
    <p class="hint"><span class="req">*</span> Campos obligatorios</p>
    <button class="btn" id="buso" onclick="envUso()">Guardar registro</button>
  </div>
</div>

<!-- GASOIL -->
<div class="sec" id="tab-gasoil">
  <div class="card">
    <div class="ct"><span class="ct-bar"></span>Carga de gasoil / nafta</div>

    <div class="f">
      <label>Equipo <span class="req">*</span></label>
      <select id="ge"><option value="">— Seleccionar —</option></select>
    </div>
    <div class="f">
      <label>Operario <span class="req">*</span></label>
      <select id="go"><option value="">— Seleccionar —</option></select>
    </div>
    <div class="f">
      <label>Obra / Lugar</label>
      <select id="gw"><option value="">— Seleccionar —</option></select>
    </div>
    <div class="f">
      <label>Litros cargados <span class="req">*</span></label>
      <input type="number" id="gl" placeholder="Ej: 120" inputmode="decimal">
    </div>
    <div class="f">
      <label>Horas / Km actuales <span class="req">*</span></label>
      <input type="number" id="ghk" placeholder="Ej: 2540" inputmode="numeric">
    </div>
    <div class="f">
      <label>Observaciones</label>
      <textarea id="gob" placeholder="Opcional"></textarea>
    </div>
    <p class="hint"><span class="req">*</span> Campos obligatorios</p>
    <button class="btn" id="bgas" onclick="envGas()">Guardar carga</button>
  </div>
</div>

<!-- HISTORIAL -->
<div class="sec" id="tab-historial">
  <div id="hlist"></div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
var URL_="https://script.google.com/macros/s/AKfycbzoEu3ix-IgVOREpqLJrjQn4nhgIxAjggk1XcmusVwj_C296PRtxzYU4bEzBuugM5qM5w/exec";
var HIST=JSON.parse(localStorage.getItem("pam_hist")||"[]");

document.getElementById("hfecha").textContent=
  new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});

cargarListas();

function guardarUrl(){
  var v=document.getElementById("iurl").value.trim();
  if(!v||v.indexOf("script.google.com")===-1){toast("URL inválida","err");return;}
  URL_=v;localStorage.setItem("pam_url",URL_);
  document.getElementById("cfg").classList.add("hidden");
  cargarListas();
}

function jsonp(url,cb){
  var n="cb_"+Math.random().toString(36).slice(2);
  window[n]=function(d){delete window[n];document.head.removeChild(s);cb(null,d);};
  var s=document.createElement("script");
  s.onerror=function(){delete window[n];document.head.removeChild(s);cb(new Error("err"));};
  s.src=url+(url.indexOf("?")>=0?"&":"?")+"callback="+n;
  document.head.appendChild(s);
}

function cargarListas(){
  if(!URL_)return;
  jsonp(URL_+"?action=getListas",function(err,d){
    if(err||!d||!d.ok){toast("No se pudo cargar las listas","err");return;}
    fill("ue",d.equipos); fill("uo",d.operarios); fill("uw",d.obras);
    fill("ge",d.equipos); fill("go",d.operarios); fill("gw",d.obras);
  });
}

function fill(id,list){
  var s=document.getElementById(id);
  s.innerHTML="<option value=''>— Seleccionar —</option>"+
    list.map(function(v){return"<option value='"+v+"'>"+v+"</option>";}).join("");
}

function g(id){return document.getElementById(id).value.trim();}

function marcarError(id){
  var el=document.getElementById(id);
  el.classList.add("error");
  el.addEventListener("change",function(){el.classList.remove("error");},{once:true});
  el.addEventListener("input",function(){el.classList.remove("error");},{once:true});
}

function envUso(){
  var ok=true;
  if(!g("ue")){marcarError("ue");ok=false;}
  if(!g("uo")){marcarError("uo");ok=false;}
  if(!g("uhk")){marcarError("uhk");ok=false;}
  if(!ok){toast("Completá los campos obligatorios (*)","err");return;}

  var b=document.getElementById("buso");
  b.disabled=true;b.innerHTML='<span class="spin"></span>Guardando...';
  var p={action:"registrarUso",equipo:g("ue"),operario:g("uo"),obra:g("uw"),
    horasKm:g("uhk"),trabajo:g("ut"),arreglos:g("ua"),observaciones:g("uob")};
  call(p,"uso",b,"Guardar registro");
}

function envGas(){
  var ok=true;
  if(!g("ge")){marcarError("ge");ok=false;}
  if(!g("go")){marcarError("go");ok=false;}
  if(!g("gl")){marcarError("gl");ok=false;}
  if(!g("ghk")){marcarError("ghk");ok=false;}
  if(!ok){toast("Completá los campos obligatorios (*)","err");return;}

  var b=document.getElementById("bgas");
  b.disabled=true;b.innerHTML='<span class="spin"></span>Guardando...';
  var p={action:"registrarGasoil",equipo:g("ge"),operario:g("go"),obra:g("gw"),
    litros:g("gl"),horasKm:g("ghk"),observaciones:g("gob")};
  call(p,"gasoil",b,"Guardar carga");
}

function call(p,tipo,btn,label){
  if(!URL_){toast("Configurá la URL primero","err");btn.disabled=false;btn.textContent=label;return;}
  var qs=Object.keys(p).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(p[k]);}).join("&");
  jsonp(URL_+"?"+qs,function(err,d){
    btn.disabled=false;btn.textContent=label;
    if(err||!d){toast("Sin conexión. Reintentá.","err");return;}
    if(d.ok){
      HIST.unshift(Object.assign({},p,{tipo:tipo,ts:new Date().toISOString()}));
      if(HIST.length>50)HIST=HIST.slice(0,50);
      localStorage.setItem("pam_hist",JSON.stringify(HIST));
      limpiar(tipo);toast("✓ Guardado en el Sheet","ok");
    }else{toast("Error: "+(d.mensaje||"?"),"err");}
  });
}

function limpiar(t){
  if(t==="uso"){
    ["ue","uo","uw","ut"].forEach(function(i){document.getElementById(i).value="";});
    ["uhk","ua","uob"].forEach(function(i){document.getElementById(i).value="";});
  }else{
    ["ge","go","gw"].forEach(function(i){document.getElementById(i).value="";});
    ["gl","ghk","gob"].forEach(function(i){document.getElementById(i).value="";});
  }
}

function tab(n,el){
  document.querySelectorAll(".sec").forEach(function(s){s.classList.remove("active");});
  document.querySelectorAll(".nb").forEach(function(b){b.classList.remove("active");});
  document.getElementById("tab-"+n).classList.add("active");
  if(el)el.classList.add("active");
  if(n==="historial")renderHist();
}

function renderHist(){
  var el=document.getElementById("hlist");
  if(!HIST.length){el.innerHTML='<div class="empty">Sin registros en este dispositivo.</div>';return;}
  el.innerHTML=HIST.map(function(h){
    var f=new Date(h.ts).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    var badge=h.tipo==="gasoil"?'<span class="badge bg">Gasoil</span>':'<span class="badge bu">Uso</span>';
    var det=h.tipo==="gasoil"
      ?h.operario+" · "+h.litros+"L · "+h.horasKm+" hs/km"
      :h.operario+" · "+h.horasKm+" hs/km · "+(h.trabajo||"—");
    return'<div class="hi"><div class="hi-top"><span class="hi-eq">'+h.equipo+badge+'</span><span class="hi-t">'+f+'</span></div><div class="hi-d">'+det+'</div></div>';
  }).join("");
}

function toast(msg,type){
  var t=document.getElementById("toast");
  t.textContent=msg;t.className="toast "+type;
  clearTimeout(window._tt);
  window._tt=setTimeout(function(){t.className="toast hidden";},3500);
}
</script>
</body>
</html>
